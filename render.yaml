# Render Blueprint for the FastAPI backend (the frontend deploys to Vercel).
# Free plan: no persistent disk, so the SQLite file is re-created and re-seeded on every
# restart (including waking from idle). To keep accounts and progress, upgrade to a paid
# instance and add:
#   plan: starter
#   disk: { name: data, mountPath: /var/data, sizeGB: 1 }
#   envVars: DATABASE_URL = sqlite:////var/data/duolingo.db
services:
  - type: web
    name: duolingo-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false  # set in the Render dashboard (optional: enables "Continue with Google")
      - key: RESET_DB_ON_SCHEMA_CHANGE
        value: "0"  # with a persistent disk: never wipe real accounts on deploy
      - key: COOKIE_SECURE
        value: "1"
      - key: HEART_REGEN_MINUTES
        value: "30"
